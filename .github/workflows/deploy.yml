name: Deploy portfolio
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          NEXT_PUBLIC_FORM_URL: ${{ vars.NEXT_PUBLIC_FORM_URL }}
      - name: Create portfolio subfolder for GitHub Pages
        run: |
          mkdir -p out/portfolio
          cp -r out/_next out/portfolio/_next 2>/dev/null || true
          cp -r out/*.html out/portfolio/ 2>/dev/null || true
          cp -r out/*.txt out/portfolio/ 2>/dev/null || true
          cp -r out/*.png out/portfolio/ 2>/dev/null || true
          cp -r out/*.jpg out/portfolio/ 2>/dev/null || true
          cp -r out/*.jpeg out/portfolio/ 2>/dev/null || true
          cp -r out/*.pdf out/portfolio/ 2>/dev/null || true
          cp -r out/frames out/portfolio/frames 2>/dev/null || true
          cp -r out/404 out/portfolio/404 2>/dev/null || true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
